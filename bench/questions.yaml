# Twelve questions, two per category, each answered from SRD 5.2.1.
#
# gold_facts:    what a correct answer states; the judge marks each one.
# gold_sections: the sections stating them; citations are scored against
#                these (a cited ancestor or descendant counts too).
# must_not:      a wrong answer worth catching, usually the 2014 rule.
# not_in_srd:    the right answer is that the SRD does not cover it.

- id: prone
  category: direct lookup
  question: What happens to a creature that has the Prone condition?
  gold_facts:
    - It can only crawl, or spend half its Speed (rounded down) to stand up and end the condition.
    - It cannot stand up if its Speed is 0.
    - It has Disadvantage on its attack rolls.
    - Attack rolls against it have Advantage if the attacker is within 5 feet, and Disadvantage otherwise.
  gold_sections: ["11.2.114"]
  must_not:
    - Attacks against it have Advantage regardless of distance.

- id: short-rest
  category: direct lookup
  question: How long is a Short Rest, and what interrupts one?
  gold_facts:
    - A Short Rest lasts 1 hour.
    - It needs at least 1 Hit Point to start.
    - Rolling Initiative interrupts it.
    - Casting a spell other than a cantrip interrupts it.
    - Taking any damage interrupts it.
    - An interrupted Short Rest gives no benefits.
  gold_sections: ["11.2.126"]
  must_not:
    - A Short Rest lasts less than 1 hour (for example 10 minutes).

- id: fireball
  category: precise numbers
  question: What are Fireball's level, range, area, saving throw and damage, and how does it scale?
  gold_facts:
    - It is a level 3 spell.
    - Its range is 150 feet.
    - It fills a 20-foot-radius Sphere.
    - Each creature in it makes a Dexterity saving throw.
    - It deals 8d6 Fire damage on a failed save, half on a success.
    - The damage increases by 1d6 for each spell slot level above 3.
  gold_sections: ["10.3.123"]
  must_not: []

- id: red-dragon-breath
  category: precise numbers
  question: What does an Adult Red Dragon's Fire Breath do?
  gold_facts:
    - It recharges on a 5 or 6.
    - It is a DC 21 Dexterity saving throw.
    - It covers a 60-foot Cone.
    - It deals 59 (17d6) Fire damage on a failure.
    - It deals half damage on a success.
  gold_sections: ["15.129.3"]
  must_not:
    - The DC is other than 21, or the damage other than 17d6 (59).

- id: champion-crit
  category: multi-hop
  question: On what d20 rolls does a level 15 Champion Fighter score a Critical Hit, and does that apply to Unarmed Strikes?
  gold_facts:
    - At level 15, Superior Critical makes it a Critical Hit on 18 to 20.
    - It applies to attack rolls with weapons and with Unarmed Strikes.
  gold_sections: ["6.5.4.5"]
  must_not:
    - It applies only to weapon attacks, not Unarmed Strikes.

- id: dark-ones-blessing
  category: multi-hop
  question: A level 5 Fiend Patron Warlock with Charisma 18 reduces an enemy to 0 Hit Points. How many Temporary Hit Points do they gain, and could they gain them when an ally drops the enemy instead?
  gold_facts:
    - Dark One's Blessing grants Temporary Hit Points equal to Charisma modifier plus Warlock level.
    - That is 4 + 5 = 9 Temporary Hit Points.
    - It also works when someone else reduces an enemy within 10 feet of the Warlock to 0 Hit Points.
  gold_sections: ["6.11.6.1"]
  must_not:
    - Any total other than 9.

- id: frightened-creatures
  category: exhaustive list
  question: Which creatures in the SRD can give a target the Frightened condition?
  # Fifteen impose it through an ability; five cast Fear, which imposes it
  # (the Black and White dragons' Frightful Presence, the Lich's Frightening
  # Gaze). The Fey Spirit of Conjure Fey and the Goat of Terror of the
  # Figurines of Wondrous Power also frighten, but print no stat block of
  # their own, so naming them is neither required nor wrong.
  gold_facts:
    - Chain Devil
    - Cloaker
    - Doppelganger
    - Ghost
    - Lion
    - Mummy
    - Nalfeshnee
    - Oni
    - Otherworldly Steed
    - Pit Fiend
    - Quasit
    - Rakshasa
    - Sea Hag
    - Sphinx of Valor
    - Tarrasque
    - Adult Black Dragon (casts Fear)
    - Ancient Black Dragon (casts Fear)
    - Adult White Dragon (casts Fear)
    - Ancient White Dragon (casts Fear)
    - Lich (casts Fear)
  gold_sections: ["15.26.1", "15.30.1", "15.42.1", "15.61.1", "16.60",
                  "15.109.1", "15.110.1", "15.116.1", "10.3.119.1",
                  "15.122.1", "15.127.1", "15.128.1", "15.138.1",
                  "15.146.3", "15.155.1", "15.16.3", "15.16.4", "15.169.3",
                  "15.169.4", "15.98.1"]
  must_not:
    - Names a creature the SRD does not include, such as a Beholder or a Mummy Lord.
    - Says dragons of other colours (Red, Blue, Green, metallic) can frighten; only the Black and White dragons can.

- id: finesse-weapons
  category: exhaustive list
  question: Which weapons have the Finesse property, and what does Finesse let you do?
  gold_facts:
    - Dagger
    - Dart
    - Rapier
    - Scimitar
    - Shortsword
    - Whip
    - Finesse lets you use Strength or Dexterity for the attack and damage rolls, the same modifier for both.
  gold_sections: ["9.2.5", "9.2.3.2"]
  must_not:
    - Any other weapon has Finesse.

- id: surprise
  category: edition trap
  question: What happens to a creature that is surprised when combat starts?
  gold_facts:
    - A surprised creature has Disadvantage on its Initiative roll.
    - That is the whole effect of surprise.
  gold_sections: ["4.8.1.2", "11.2.140"]
  must_not:
    - A surprised creature cannot move or take actions on its first turn, or cannot take Reactions until its turn ends.

- id: grapple
  category: edition trap
  question: How do I grapple a creature, and how does it escape?
  gold_facts:
    - Grappling is an option of an Unarmed Strike.
    - The target makes a Strength or Dexterity saving throw, its choice, or has the Grappled condition.
    - The DC is 8 + the grappler's Strength modifier + Proficiency Bonus.
    - The target can be no more than one size larger than the grappler.
    - To escape, the target uses its action for a Strength (Athletics) or Dexterity (Acrobatics) check against the grapple's escape DC.
  gold_sections: ["11.2.149", "11.2.72"]
  must_not:
    - Grappling is a contested Strength (Athletics) check against the target's Athletics or Acrobatics.

- id: hexblade
  category: not in SRD
  question: What does the Hexblade Warlock's Hex Warrior feature do?
  not_in_srd: true
  gold_facts:
    - The SRD does not include the Hexblade or Hex Warrior.
    - The SRD's Warlock subclass is the Fiend Patron.
  gold_sections: ["6.11.6"]
  must_not:
    - Describes Hex Warrior's effects (Charisma for weapon attacks) as SRD rules.

- id: beholder
  category: not in SRD
  question: What are a Beholder's eye rays?
  not_in_srd: true
  gold_facts:
    - The SRD does not include the Beholder.
  gold_sections: []
  must_not:
    - Lists eye rays as SRD content.
