name: rules-lawyer

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: rules-lawyer-neo4j
    ports:
      - "7474:7474"  # HTTP (Browser UI)
      - "7687:7687"  # Bolt (driver connections)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD env variable is required}
      # Neo4j sizes its memory from the host's; this graph needs far less, and
      # the test suites start Neo4j containers of their own beside this one.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Loads the graph, unless the one already there verifies against the
  # image's artifact, then exits.
  loader:
    image: ghcr.io/itsmariodias/rules-lawyer:latest
    build: .
    command: ["rules-lawyer", "load", "--if-needed"]
    env_file: .env
    # Container paths, over any host paths .env sets for development. Blank
    # embeddings is unset: the provider's file in the image.
    environment: &container
      NEO4J_URI: bolt://neo4j:7687
      RULES_LAWYER_DATA: /app/data
      RULES_LAWYER_EMBEDDINGS: ""
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  # The API and the frontend on one port: http://localhost:8080
  app:
    image: ghcr.io/itsmariodias/rules-lawyer:latest
    build: .
    env_file: .env
    environment: *container
    ports:
      - "${RULES_LAWYER_PORT:-8080}:8000"
    volumes:
      - chat:/app/data/chat
    depends_on:
      loader:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  chat:
