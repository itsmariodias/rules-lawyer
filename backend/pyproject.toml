[project]
name = "dnd-graph-rag"
version = "0.1.0"
description = "Knowledge-graph RAG for D&D 5e rules interactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.115",
    "google-genai>=2.20.0",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "neo4j>=5.26",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.32",
]

[project.scripts]
srd-parse = "dnd_graph_rag.srd.pipeline:main"
srd-graph-load = "dnd_graph_rag.graph.cli:main"
srd-embed = "dnd_graph_rag.graph.cli:embed_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_graph_rag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
